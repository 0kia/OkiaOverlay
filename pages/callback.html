<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>okia's Overlay - Link</title>
        <link rel="stylesheet" href="../styles/style.css">
        <link rel="stylesheet" href="../styles/Overlay.css">
    </head>

    <body>
        <h1>Your Overlay Link</h1>

        <div class="center">
            <p id="status">Logging in...</p>

            <div id="preview-section" class="preview-section hidden">
                <div class="preview-header">
                    <h2 class="options-title">Preview</h2>
                    <button id="preview-replay" type="button">Replay transition</button>
                </div>
                <div class="preview-canvas">
                    <div id="song">
                        <img
                            id="album-art"
                            alt=""
                            src="data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='100' height='100'%3E%3Crect width='100' height='100' fill='%23333'/%3E%3Ctext x='50' y='63' font-size='42' text-anchor='middle' fill='%23888'%3E%E2%99%AA%3C/text%3E%3C/svg%3E"
                        >
                        <div id="song-text">
                            <div id="artist">Sample Artist Featuring Someone Else</div>
                            <div id="track">This Is An Example Song Title For The Preview</div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="options-panel" class="options-columns hidden">
                <div class="options-panel">
                    <h2 class="options-title">Visuals</h2>

                    <label id="album-art-option" class="option-row">
                        <span>Show album art</span>
                        <input type="checkbox" id="show-album-art" checked>
                    </label>
                    <label id="flip-option" class="option-row">
                        <span>Title on Top</span>
                        <input type="checkbox" id="flip-order">
                    </label>
                    <label id="bg-color-option" class="option-row">
                        <span>Background color</span>
                        <span class="option-controls">
                            <input type="checkbox" id="enable-bg-color">
                            <input type="color" id="bg-color-picker" value="#121212" disabled>
                        </span>
                    </label>
                    <label id="border-radius-option" class="option-row option-row--nested hidden">
                        <span>Border radius (px)</span>
                        <input type="number" id="border-radius" value="10" min="0" max="100" step="1">
                    </label>
                    <label id="caps-artist-option" class="option-row">
                        <span>Capitalize artist</span>
                        <input type="checkbox" id="caps-artist">
                    </label>
                    <label id="caps-track-option" class="option-row">
                        <span>Capitalize song title</span>
                        <input type="checkbox" id="caps-track">
                    </label>
                    <label id="font-option" class="option-row">
                        <span>Font</span>
                        <select id="font-select">
                            <option value="default" selected>Default</option>
                            <option value="montserrat">Montserrat</option>
                            <option value="roboto">Roboto</option>
                            <option value="inter">Inter</option>
                            <option value="bebas">Bebas Neue</option>
                        </select>
                    </label>
                </div>

                <div class="options-panel">
                    <h2 class="options-title">Functionality</h2>

                    <label id="autohide-option" class="option-row">
                        <span>Auto-hide</span>
                        <input type="checkbox" id="enable-autohide">
                    </label>
                    <label id="duration-option" class="option-row option-row--nested">
                        <span>Duration (s)</span>
                        <input type="number" id="autohide-duration" value="7" min="1" max="30" step="0.5">
                    </label>
                    <label id="transition-option" class="option-row option-row--nested">
                        <span>Transition</span>
                        <select id="transition-style">
                            <option value="none">None</option>
                            <option value="fade" selected>Fade</option>
                            <option value="bounce">Bounce</option>
                        </select>
                    </label>

                    <label id="title-scroll-option" class="option-row">
                        <span>Title Scroll</span>
                        <input type="checkbox" id="title-scroll" checked>
                    </label>
                    <label id="title-scroll-type-option" class="option-row option-row--nested">
                        <span>Scroll Type</span>
                        <select id="title-scroll-type">
                            <option value="shuttle" selected>Shuttle</option>
                            <option value="continuous">Continuous</option>
                        </select>
                    </label>
                    <label id="title-trigger-option" class="option-row option-row--nested">
                        <span>Trigger</span>
                        <select id="title-trigger">
                            <option value="song_length" selected>Song length</option>
                            <option value="always">Always</option>
                        </select>
                    </label>

                    <label id="artist-scroll-option" class="option-row">
                        <span>Artist Scroll</span>
                        <input type="checkbox" id="artist-scroll" checked>
                    </label>
                    <label id="artist-scroll-type-option" class="option-row option-row--nested">
                        <span>Scroll Type</span>
                        <select id="artist-scroll-type">
                            <option value="shuttle" selected>Shuttle</option>
                            <option value="continuous">Continuous</option>
                        </select>
                    </label>
                    <label id="artist-trigger-option" class="option-row option-row--nested">
                        <span>Trigger</span>
                        <select id="artist-trigger">
                            <option value="song_length" selected>Song length</option>
                            <option value="always">Always</option>
                        </select>
                    </label>

                    <label id="width-option" class="option-row">
                        <span>Container width</span>
                        <input type="number" id="text-width" value="400" min="100" max="2000" step="10">
                    </label>
                </div>
            </div>
        </div>

        <script src="../scripts/callback.js"></script>
    </body>
</html>
